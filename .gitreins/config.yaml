guards:
  allow_skips: true
  test_mode: diff
  secrets: true
  lint: false
  tests: true
  test_command: python3 -m pytest tests/ -q
pipeline:
  stages:
    - id: tier1
      parallel: true
      steps:
        - id: secrets
          type: script
          on_fail: block
          run: |
            STAGED=$(git diff --cached --name-only --diff-filter=ACM 2>/dev/null || echo "")
            [ -z "$STAGED" ] && exit 0
            SECRET_PATTERNS='\bsk-[a-zA-Z0-9_-]{20,}|ghp_[a-zA-Z0-9]{36}|-----BEGIN (RSA |EC |OPENSSH )PRIVATE KEY-----|(OPENROUTER|DEEPSEEK|ZAI|ANTHROPIC|OPENAI)_API_KEY\s*=\s*(sk-[a-zA-Z0-9_-]{20,}|[A-Za-z0-9+/=]{32,})'
            PASS=1
            while IFS= read -r file; do
              [ ! -f "$file" ] && continue
              git check-ignore -q "$file" 2>/dev/null && continue
              if grep -Pn "$SECRET_PATTERNS" "$file" 2>/dev/null; then
                echo "SECRET DETECTED in $file" >&2
                PASS=0
              fi
            done <<< "$STAGED"
            [ $PASS -eq 0 ] && exit 1
            echo "Secrets scan: PASS"
        - id: writing_rules
          type: script
          on_fail: block
          run: "python3 scripts/style_check.py"
        - id: manifest
          type: script
          on_fail: block
          run: "python3 scripts/manifest_check.py"
        - id: tests
          type: script
          on_fail: continue
          timeout: 300
          run: "python3 -m pytest tests/ -q"
    - id: tier2
      type: ai_eval
      condition: "true"
      max_iterations: 60
      tools: [read_file, run_command, search_pattern, read_diff]
      prompt_template: |
        You are the WRITING-RULES judge for the coding-hermes skills repo.
        FIRST read coding-hermes-writing/SKILL.md in full — it is the normative rule set.
        Grade the task's diff against those rules. Grade only MATERIAL SKILL.md edits:
        if the diff touches only scripts/, references/, skills-manifest.json or board
        files, pass with one line "reference-only churn, not graded". Do not grade the
        underlying feature a skill describes — only the writing. Do not run any test
        suite; tier-1 already ran it. One criterion per proof; FAIL on violation.
